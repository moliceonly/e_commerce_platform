services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: training_lib
      MYSQL_USER: trainer
      MYSQL_PASSWORD: "Train2026Lib!"
    ports:
      - "3306:3306"
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      APP_ENV: docker
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "trainer:Train2026Lib!@tcp(mysql:3306)/training_lib?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "compose-dev-secret"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # 在容器内跑单测（连 compose 的 mysql）。用法见 README。
  test:
    profiles: ["test"]
    image: docker.m.daocloud.io/library/golang:1.24-alpine
    working_dir: /src
    volumes:
      - ..:/src
    environment:
      GOPROXY: "https://goproxy.cn,direct"
      MYSQL_DSN: "trainer:Train2026Lib!@tcp(mysql:3306)/training_lib?charset=utf8mb4&parseTime=True&loc=Local"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["go", "test", "./internal/auth/", "./internal/handler/", "./internal/service/", "-count=1", "-v"]
